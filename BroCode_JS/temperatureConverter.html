        <main>

            <form id="temperatureConverter">
                
                <label id="converterTitle">Temperature conversion:</label>
                <br>
                <input type="number" id="temperatureInput" placeholder="Enter temp:">
                <br>
                <radio id="conversionSelection">
                    <input type="radio" name="conversionSelection" id="c2f" checked="checked">
                    <label>Celcius &#8594 Fahrenheit</label>
                </radio>
                <radio id="conversionSelection">
                    <input type="radio" name="conversionSelection" id="f2c">
                    <label>Fahrenheit &#8592 Celcius</label>
                </radio>

                <button type="button" id="convertSubmit">Submit</button>
                <br>
                <label id="convertedTemp"></label>

            </form>

        </main>
